# topf issues short-lived admin certs by default; 8760h keeps the
# kubeconfig usable long-term.
[tasks.talos]
description = "Bootstrap the Talos cluster"
dir = "{{ config_root }}/../talos"
run = [{ task = ":talos-secret" }, '''
{{ vars.log }} info "Applying talos config and bootstrapping" stage talos-apply
topf apply --auto-bootstrap --confirm=false
''', '''
{{ vars.log }} info "Generating talosconfig" stage talos-talosconfig
topf talosconfig > "$TALOSCONFIG"
''', '''
{{ vars.log }} info "Fetching kubeconfig" stage talos-kubeconfig
topf kubeconfig --validity 8760h > "$KUBECONFIG"
''']

[tasks.apps]
description = "Bootstrap apps into the Talos cluster"
run = [
  { task = ":apps-ready" },
  { task = ":apps-namespaces" },
  { task = ":apps-secrets" },
  { task = ":apps-crds" },
  { task = ":apps-helm" },
  '{{ vars.log }} info "Cluster is bootstrapped — Flux will start syncing the Git repository"',
]

# No sops call or existence guard is needed: the bundle is stored already
# encrypted with the repo's age recipient, and existing bundles are left
# untouched.
[tasks.talos-secret]
hide = true
dir = "{{ config_root }}/../talos"
run = '''
{{ vars.log }} info "Generating secrets" stage talos-secret
topf secrets --confirm=false > /dev/null
'''

[tasks.apps-crds]
hide = true
run = '''
{{ vars.log }} info "Applying CRDs" stage apps-crds
if ! helmfile --file helmfile/crds.yaml template --quiet | yq eval-all --exit-status 'select(.kind == "CustomResourceDefinition")' | kubectl apply --server-side --force-conflicts --filename -; then
    {{ vars.log }} fatal "Failed to apply crds"
fi
'''

[tasks.apps-helm]
hide = true
run = '''
{{ vars.log }} info "Syncing helmfile" stage apps-helm
if ! helmfile --file helmfile/apps.yaml sync --hide-notes; then
    {{ vars.log }} fatal "Failed to sync helmfile"
fi
'''

[tasks.apps-namespaces]
hide = true
run = '''
{{ vars.log }} info "Applying namespaces for apps" stage apps-namespaces
for app in ../kubernetes/apps/*/; do
    ns="$(basename "$app")"
    if kubectl create namespace "$ns" --dry-run=client -o yaml \
            | kubectl apply --server-side --filename - &>/dev/null; then
        {{ vars.log }} info "Namespace applied" namespace "$ns"
    else
        {{ vars.log }} fatal "Failed to apply namespace" namespace "$ns"
    fi
done
'''

[tasks.apps-secrets]
hide = true
run = '''
{{ vars.log }} info "Applying secrets for apps" stage apps-secrets
for secret in \
    deploy-key.sops.yaml \
    sops-age.sops.yaml \
    ../kubernetes/components/sops/cluster-secrets.sops.yaml
do
    name="$(basename "$secret" .sops.yaml)"
    if sops decrypt "$secret" \
            | kubectl --namespace flux-system apply --server-side --filename - &>/dev/null; then
        {{ vars.log }} info "Secret applied" resource "$name"
    else
        {{ vars.log }} fatal "Failed to apply secret" resource "$name"
    fi
done
'''

# Wait until nodes register as Ready=False. They only become Ready=True once the CNI is healthy.
[tasks.apps-ready]
hide = true
run = '''
{{ vars.log }} info "Waiting for nodes to register as Ready=False" stage apps-ready
if ! kubectl wait nodes --for=condition=Ready=True --all --timeout=10s &>/dev/null; then
    deadline=$((SECONDS + 600))
    until kubectl wait nodes --for=condition=Ready=False --all --timeout=10s &>/dev/null; do
        if (( SECONDS >= deadline )); then
            {{ vars.log }} fatal "Timed out waiting for nodes to register"
        fi
        {{ vars.log }} info "Nodes not available, waiting for nodes to be available. Retrying in 5 seconds..."
        sleep 5
    done
fi
'''
