min_version = "2026.10.18"
monorepo_root = true

[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"

[tools]
age = "1.3.2"
cloudflared = "2026.10.3"
flux2 = "2.9.6"
gh = "2.103.2"
gum = "2.0.2"
helm = "4.3.1"
helmfile = "1.8.2"
jq = "1.8.2"
kubeconform = "0.8.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
lefthook = "2.2.2"
node = "24.22.1"
oxfmt = "0.74.0"
shellcheck = "0.11.0"
sops = "3.13.3"
talosctl = "1.14.4"
"github:postfinance/topf" = "v0.6.2"
yq = "4.54.1"
zizmor = "1.31.1"

[tasks.log]
hide = true
run = "gum log -t rfc3339 -s -l"

[task_config]
cascade = true
shell = "bash -euo pipefail -c"

[monorepo]
# A glob skips directories without a mise.toml: bootstrap/, kubernetes/ and
# talos/ only exist once rendered, and template/ is archived by tidy. Any other
# top-level directory with a mise.toml becomes a project too.
config_roots = ["*"]

[settings]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]
task.quiet = true

[hooks]
postinstall = "lefthook install"
