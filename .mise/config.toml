min_version = "2026.11.3"
monorepo_root = true

[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"

[tools]
age = "1.3.2"
cloudflared = "2026.11.1"
"aqua:home-operations/flate" = "0.7.3"
flux2 = "2.10.0"
gum = "2.0.2"
helm = "4.3.2"
helmfile = "1.8.4"
jq = "1.8.2"
kubeconform = "0.8.0"
kubectl = "1.37.2"
kustomize = "5.8.3"
lefthook = "2.2.2"
"github:oxc-project/oxc" = { version = "0.79.0", version_prefix = "oxfmt_v", matching_regex = "^oxfmt-", rename_exe = "oxfmt" }
shellcheck = "0.11.0"
sops = "3.13.3"
talosctl = "1.14.6"
"github:postfinance/topf" = "v0.6.2"
yq = "4.54.3"
zizmor = "1.32.0"

[tasks.log]
hide = true
run = "gum log -t rfc3339 -s -l"

# sops metadata alone does not mean the values are encrypted: a file without
# data/stringData gets metadata and a MAC but no other ENC[] value.
[tasks.check-sops]
hide = true
usage = 'arg "<file>" var=#true help="SOPS files to check"'
run = '''
eval "files=($usage_file)"
rc=0
for f in "${files[@]}"; do
    if ! sops filestatus "$f" 2>/dev/null | jq --exit-status '.encrypted == true' >/dev/null; then
        mise run //:log error "File is not encrypted" file "$f"
        rc=1
    elif ! grep -F 'ENC[' "$f" | grep -qvE '^[[:space:]]*"?(sops_)?mac"?[[:space:]]*[:=]'; then
        mise run //:log error "File has no encrypted values, only data and stringData are encrypted" file "$f"
        rc=1
    fi
done
exit "$rc"
'''

[task_config]
cascade = true
shell = "bash -euo pipefail -c"

[monorepo]
# A glob skips directories without a mise.toml: bootstrap/, kubernetes/ and
# talos/ only exist once rendered, and template/ is archived by tidy. Any other
# top-level directory with a mise.toml becomes a project too.
config_roots = ["*"]

[settings]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]
task.quiet = true

[hooks]
postinstall = "lefthook install"
