[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/talosconfig"
JUST_UNSTABLE = "1"

[tools]
uv = "0.12.3"                       # required:template
age = "1.3.1"
cloudflared = "2026.8.1"
flux2 = "2.9.4"
gh = "2.97.0"
gum = "0.17.0"
helm = "4.2.4"
helmfile = "1.7.3"
jq = "1.8.2"
just = "1.58.0"
kubeconform = "0.8.0"
kubectl = "1.36.3"
kustomize = "5.8.1"
lefthook = "2.1.10"
node = "24.19.0"
oxfmt = "0.63.0"
sd = "1.1.0"                        # required:template
sops = "3.13.3"
talosctl = "1.13.7"
"github:postfinance/topf" = "v0.5.0"
yq = "4.53.3"
zizmor = "1.29.0"

[hooks]
postinstall = "lefthook install"
