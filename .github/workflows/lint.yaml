---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Lint"

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: lefthook shellcheck zizmor

      # Reuses the pre-commit hook definitions so globs and flags live in .lefthook.toml.
      - name: Run shellcheck and zizmor
        run: lefthook run pre-commit --all-files --no-auto-install --command shellcheck --command zizmor
