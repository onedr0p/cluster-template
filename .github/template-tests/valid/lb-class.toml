[network]
node_cidr = "10.10.10.0/24"

[kubernetes.api]
addr = "10.10.10.254"

# Nothing is announced over L2 or BGP: the public gateway is served on the
# nodes' own IPs (Cilium node IPAM) and the internal gateway and DNS by the
# Tailscale operator.
[cilium]
announce = "none"

[gateways]
internal = { load_balancer_class = "tailscale" }
dns = { load_balancer_class = "tailscale" }
external = { load_balancer_class = "io.cilium/node" }

[domain]
name = "example.com"

[dns]
token = "fake"

[ingress]
mode = "direct"

[repository]
url = "https://github.com/onedr0p/cluster-template.git"

[[nodes]]
name = "k8s-0"
address = "10.10.10.100"
controller = true
disk = "/dev/sdfake"
mac_addr = "00:00:00:00:00:00"
schematic_id = "376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba"
