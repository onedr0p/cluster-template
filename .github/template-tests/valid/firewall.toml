# A single VPS on a public IP: admin access over Tailscale, the external
# gateway forwarded directly.
[network]
node_cidr = "10.10.10.0/24"

[kubernetes.api]
addr     = "10.10.10.100"
vip      = false
tls_sans = ["100.64.0.10"]

[gateways]
internal = "10.10.10.252"
dns      = "10.10.10.253"
external = "10.10.10.251"

[domain]
name = "example.com"

[dns]
token = "fake"

[ingress]
mode = "direct"

[repository]
url = "https://github.com/onedr0p/cluster-template.git"

[talos]
firewall    = true
admin_cidrs = ["100.64.0.0/10"]

[[nodes]]
name         = "k8s-0"
address      = "10.10.10.100"
controller   = true
disk         = "/dev/sdfake"
mac_addr     = "00:00:00:00:00:00"
schematic_id = "376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba"
