# Three controllers and a worker behind the firewall, peering BGP with the
# router and administered from a management network.
[network]
node_cidr = "10.10.10.0/24"

[kubernetes.api]
addr = "10.10.10.254"

[gateways]
internal = "10.10.10.252"
dns      = "10.10.10.253"
external = "10.10.10.251"

[domain]
name = "example.com"

[dns]
token = "fake"

[repository]
url = "https://github.com/onedr0p/cluster-template.git"

[cilium.bgp]
router_addr = "10.10.10.1"
router_asn  = "64513"
node_asn    = "64514"

[talos]
schematic_id = "376567988ad370138ad8b2698212367b8edcb69b5fd68c80be1f2ec7d603b4ba"
firewall     = true
admin_cidrs  = ["192.168.1.0/24", "100.64.0.0/10"]

[[nodes]]
name       = "k8s-0"
address    = "10.10.10.100"
controller = true
disk       = "/dev/sdfake"
mac_addr   = "00:00:00:00:00:00"

[[nodes]]
name       = "k8s-1"
address    = "10.10.10.101"
controller = true
disk       = "/dev/sdfake"
mac_addr   = "00:00:00:00:00:01"

[[nodes]]
name       = "k8s-2"
address    = "10.10.10.102"
controller = true
disk       = "/dev/sdfake"
mac_addr   = "00:00:00:00:00:02"

[[nodes]]
name       = "k8s-3"
address    = "10.10.10.103"
controller = false
disk       = "/dev/sdfake"
mac_addr   = "00:00:00:00:00:03"
